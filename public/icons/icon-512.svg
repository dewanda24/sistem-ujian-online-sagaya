<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cbtGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow512" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1e3a8a" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#cbtGrad512)" />
  
  <!-- Subtle inner glowing ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" />
  
  <!-- Graduation Cap / Exam Icon -->
  <g filter="url(#shadow512)" transform="translate(64, 76) scale(2)">
    <!-- Cap Top Diamond -->
    <path d="M 96 16 L 180 56 L 96 96 L 12 56 Z" fill="#ffffff" />
    <!-- Cap Brim Base -->
    <path d="M 40 76 L 40 120 C 40 144 152 144 152 120 L 152 76 L 96 102 Z" fill="#e0e7ff" />
    <!-- Tassel -->
    <path d="M 166 60 L 166 112 M 160 112 L 172 112 L 166 128 Z" stroke="#fbbf24" stroke-width="4" fill="#fbbf24" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Big Checkmark Badge -->
    <circle cx="140" cy="120" r="32" fill="#10b981" />
    <path d="M 128 120 L 136 128 L 152 112" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <!-- Text Label -->
  <text x="256" y="440" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="3">CBT SAGAYA</text>
</svg>
