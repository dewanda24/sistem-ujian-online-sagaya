      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow192" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="192" height="192" rx="42" fill="url(#cbtGrad192)" />
  
  <!-- Subtle inner glowing ring -->
