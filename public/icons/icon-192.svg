    <path d="M 128 120 L 136 128 L 152 112" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <!-- Text Label -->
  <text x="96" y="166" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" letter-spacing="1">CBT SAGAYA</text>
</svg>
